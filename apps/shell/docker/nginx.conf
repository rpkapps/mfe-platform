server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  # Shared libraries and hashed assets are immutable.
  location ~ ^/(shared|assets)/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  # The environment document is written at container start and must never be cached.
  location = /platform-env.json {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }
  # Every app prefix is the shell's index page; the shell resolves the owning app from the release.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
